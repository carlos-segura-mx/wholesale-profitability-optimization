name: Publish synthetic case data

on:
  push:
    branches: [main]
    paths:
      - 'PORT01_PUBLIC_SYNTHETIC_DATA.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original checksums and compress
        run: python scripts/import_public_data.py
      - name: Check annual financial controls
        run: |
          python -m pip install pandas
          python - <<'PY'
          import pandas as pd
          sales=pd.read_csv("data/fact_sales.csv.gz")
          demand=pd.read_csv("data/fact_demand.csv.gz")
          total=sales.net_sales.sum()
          fill=demand.units_fulfilled.sum()/demand.units_requested.sum()
          assert 54_410_000 < total < 54_430_000, total
          assert 0.948 < fill < 0.950, fill
          print(f"PASS synthetic sales: MXN {total:,.2f}")
          print(f"PASS fill rate: {fill:.4%}")
          PY
      - name: Publish verified synthetic CSV archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv.gz results_shelf_only/*.csv.gz
          git rm -- PORT01_PUBLIC_SYNTHETIC_DATA.zip
          git commit -m "Publish verified compressed synthetic data for four-module demo"
          git push

name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bilingual code
        run: python -m py_compile preview_bilingue.py preview.py app_full_bilingue.py scripts/import_public_data.py scripts/generate_case_data.py scripts/replay_case.py tests/test_dashboard.py
      - name: Verify Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import streamlit, pandas, plotly; print('Imports OK')"
      - name: Test all dashboard modules and both languages
        run: python tests/test_dashboard.py
